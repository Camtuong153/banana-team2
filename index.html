<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rule Server</title>
    <!-- Thư viện đọc file Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Thư viện Cloudflare Turnstile Captcha (Chế độ render trực tiếp) -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a1d; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #2d2d31; width: 100%; max-width: 800px; border-radius: 12px; padding: 30px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .header-img { width: 80px; height: 80px; object-fit: contain; margin-bottom: -10px; }
        h1 { text-align: center; color: #5865F2; text-transform: uppercase; letter-spacing: 1px; }
        .content-box { background-color: #1e1e21; border: 1px solid #404045; border-radius: 8px; padding: 20px; max-height: 400px; overflow-y: auto; line-height: 1.6; width: 100%; }
        .content-box h1, .content-box h2, .content-box h3 { margin-bottom: 10px; color: #fff; }
        .content-box p { margin-bottom: 10px; }
        .content-box ul, .content-box ol { margin-left: 20px; margin-bottom: 10px; }
        .btn-apply { background-color: #5865F2; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.3s; align-self: center; }
        .btn-apply:hover { background-color: #4752C4; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #2d2d31; padding: 30px; border-radius: 10px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative; display: flex; flex-direction: column; align-items: center; }
        .popup-img { width: 65px; height: 65px; object-fit: contain; margin-bottom: 10px; }
        .close-btn { position: absolute; top: 10px; right: 15px; color: #aaa; font-size: 24px; cursor: pointer; }
        .close-btn:hover { color: #fff; }
        .captcha-container { margin: 20px 0; min-height: 65px; display: flex; justify-content: center; align-items: center; width: 100%; }
        .btn-discord { display: none; background-color: #27ae60; color: white; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; margin-top: 15px; transition: 0.3s; }
        .btn-discord:hover { background-color: #219150; }
    </style>
</head>
<body>
    <div class="container">
        <img id="main-photo" src="" alt="Logo" class="header-img">
        <h1>Rule Server</h1>
        <div class="content-box" id="rule-content">Đang tải nội dung...</div>
        <button class="btn-apply" id="apply-btn">Apply</button>
    </div>

    <div class="modal-overlay" id="captcha-modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <img id="popup-photo" src="" alt="Logo" class="popup-img">
            <h3>Xác thực người dùng</h3>
            <p style="font-size: 14px; color: #ccc; margin-top: 5px;">Vui lòng hoàn thành captcha để tiếp tục</p>
            <div class="captcha-container">
                <div id="turnstile-widget"></div>
            </div>
            <a href="#" id="discord-link" class="btn-discord" target="_blank">Tham gia Discord</a>
        </div>
    </div>

    <script>
        // Render tự động thay thế các biến khi deploy
        const CONFIG = {
            CAPTCHA: "RENDER_ENV_CAPTCHA",
            LINKPHOTO: "RENDER_ENV_LINKPHOTO",
            LINKTEXT: "RENDER_ENV_LINKTEXT",
            DISCORDBOT: "RENDER_ENV_DISCORDBOT"
        };

        // Gán hình ảnh & liên kết
        document.getElementById('main-photo').src = CONFIG.LINKPHOTO;
        document.getElementById('popup-photo').src = CONFIG.LINKPHOTO;
        document.getElementById('discord-link').href = CONFIG.DISCORDBOT;

        // Đọc nội dung file Markdown
        fetch(CONFIG.LINKTEXT)
            .then(res => res.text())
            .then(data => { document.getElementById('rule-content').innerHTML = marked.parse(data); })
            .catch(() => { document.getElementById('rule-content').innerHTML = "<p style='color:red;'>Lỗi tải nội dung quy định.</p>"; });

        // Xử lý sự kiện Modal Popup & Captcha Render
        const modal = document.getElementById('captcha-modal');
        let widgetId = null;

        document.getElementById('apply-btn').onclick = () => {
            modal.style.display = 'flex';
            
            // Tải Captcha khi mở Popup
            if (window.turnstile && widgetId === null) {
                widgetId = turnstile.render('#turnstile-widget', {
                    sitekey: CONFIG.CAPTCHA,
                    theme: 'dark',
                    callback: function(token) {
                        document.getElementById('discord-link').style.display = 'inline-block';
                    }
                });
            }
        };

        document.getElementById('close-modal').onclick = () => modal.style.display = 'none';
        window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
    </script>
</body>
</html>
